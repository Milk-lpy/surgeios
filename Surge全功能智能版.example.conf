[Script]
# Surge 5.22+：网络切换 / 引擎启动时主动刷新交易专用 fallback 可用性
网络变化-交易重测 = type=event,event-name=network-changed,script-path=https://raw.githubusercontent.com/Milk-lpy/surgeios/main/Scripts/network-retest.js,script-update-interval=3600,timeout=15
引擎启动-交易重测 = type=event,event-name=engine-started,script-path=https://raw.githubusercontent.com/Milk-lpy/surgeios/main/Scripts/network-retest.js,script-update-interval=3600,timeout=15

# 状态面板：显示当前网络、策略选择、普通/币安/欧易真实出口 IP 与 GeoIP/ASN
Surge状态面板 = type=generic,script-path=https://raw.githubusercontent.com/Milk-lpy/surgeios/main/Scripts/surge-status.js,script-update-interval=3600,timeout=12

[Panel]
智能网络状态 = title="Surge 智能网络",content="点击刷新：查看网络与交易出口",style=info,script-name=Surge状态面板,update-interval=60

