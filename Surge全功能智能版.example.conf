[General]
ipv6 = true
ipv6-vif = auto
dns-server = 223.5.5.5, 119.29.29.29, system
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
proxy-test-url = http://www.gstatic.com/generate_204
proxy-test-udp = apple.com@8.8.8.8
wifi-assist = true
all-hybrid = false
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
udp-policy-not-supported-behaviour = reject
always-real-ip = *.msftconnecttest.com, *.msftncsi.com, *.xboxlive.com, *.stun.*

[Proxy]
# 本地区域只保留真正属于你的固定代理；机场节点全部由 policy-path 动态导入
HomeLAN-DDNS = socks5, YOUR_HOME_DDNS, 10888, username=YOUR_USERNAME, password=YOUR_PASSWORD, test-url=http://192.168.1.2:5666/

[Proxy Group]
# ============================================================
# 1. 订阅入口
# ============================================================
✈️ 我的节点 = select, policy-path=YOUR_SURGE_SUBSCRIPTION_URL, update-interval=-1

# ============================================================
# 2. 主策略：Smart 自动 + 手动
# ============================================================
自动选择 = smart, include-other-group=✈️ 我的节点, policy-regex-filter=.+, policy-priority="\[0\.2\]:0.85;\[0\.4\]:0.90;\[0\.5\]:0.95;\[0\.6\]:1.00;\[1\.0\]:1.10;\[2\.0\]:1.30;\[2\.5\]:1.40;\[4\.0\]:1.80;\[6\.0\]:2.20;\[10\.0\]:3.00"
手动选择 = select, include-other-group=✈️ 我的节点
节点选择 = select, 自动选择, 手动选择

# ============================================================
# 3. 地区节点：普通业务追求低延迟，用 url-test
# ============================================================
香港节点 = url-test, include-other-group=✈️ 我的节点, policy-regex-filter=(?i)(🇭🇰|香港|Hong Kong|\bHK\b), interval=600, tolerance=50, no-alert=true
台湾节点 = url-test, include-other-group=✈️ 我的节点, policy-regex-filter=(?i)(🇹🇼|台湾|Taiwan|\bTW\b), interval=600, tolerance=50, no-alert=true
日本节点 = url-test, include-other-group=✈️ 我的节点, policy-regex-filter=(?i)(🇯🇵|日本|Japan|\bJP\b), interval=600, tolerance=50, no-alert=true
新加坡节点 = url-test, include-other-group=✈️ 我的节点, policy-regex-filter=(?i)(🇸🇬|新加坡|Singapore|\bSG\b), interval=600, tolerance=50, no-alert=true
美国节点 = url-test, include-other-group=✈️ 我的节点, policy-regex-filter=(?i)(🇺🇸|美国|United States|USA|\bUS\b), interval=600, tolerance=50, no-alert=true

# ============================================================
# 4. 交易专用稳定出口：不追逐最低延迟，只在当前线路失效时切换
# ============================================================
台湾交易稳定 = fallback, include-other-group=✈️ 我的节点, policy-regex-filter=(?i)(🇹🇼|台湾|Taiwan|\bTW\b), interval=600, timeout=3, evaluate-before-use=true, no-alert=true
新加坡交易稳定 = fallback, include-other-group=✈️ 我的节点, policy-regex-filter=(?i)(🇸🇬|新加坡|Singapore|\bSG\b), interval=600, timeout=3, evaluate-before-use=true, no-alert=true

# ============================================================
# 5. 网络环境自适应
# wait / sky：家里已有网关代理，Surge 不二次代理
# 其他 Wi-Fi / CPE / 蜂窝：恢复 Surge 自己的策略
# ============================================================
通用网络 = subnet, default=节点选择, SSID:wait=DIRECT, SSID:sky=DIRECT, hidden=true
币安网络 = subnet, default=台湾交易稳定, SSID:wait=DIRECT, SSID:sky=DIRECT, hidden=true
欧易网络 = subnet, default=新加坡交易稳定, SSID:wait=DIRECT, SSID:sky=DIRECT, hidden=true
GV网络 = subnet, default=美国节点, SSID:wait=DIRECT, SSID:sky=DIRECT, hidden=true

# ============================================================
# 6. 业务策略
# ============================================================
全球加速 = select, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, DIRECT
谷歌服务 = select, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, DIRECT
苹果服务 = select, DIRECT, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点
电报信息 = select, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, DIRECT
奈飞视频 = select, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, DIRECT
迪士尼+ = select, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, DIRECT
油管视频 = select, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, DIRECT
Spotify音乐 = select, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, DIRECT
国际媒体 = select, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, DIRECT
微软服务 = select, DIRECT, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点
游戏平台 = select, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, DIRECT
智能助理 = select, 通用网络, 美国节点, 日本节点, 新加坡节点, 香港节点, 台湾节点, 节点选择
Google Voice = select, GV网络, 美国节点, 节点选择, DIRECT
欧易交易 = select, 欧易网络, 新加坡交易稳定, 新加坡节点, 香港节点, 日本节点, 台湾节点, 美国节点, 节点选择, DIRECT
币安交易 = select, 币安网络, 台湾交易稳定, 台湾节点, 节点选择, DIRECT
家里LAN = select, DIRECT, HomeLAN-DDNS
兜底分流 = select, 通用网络, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, DIRECT

[SSID Setting]
# 家中 Wi-Fi：关闭蜂窝辅助，并使用系统/路由器 DNS，避免内网域名被公网 DoH 接管
SSID:wait cellular-fallback=off,dns-server=system,encrypted-dns-server=off
SSID:sky cellular-fallback=off,dns-server=system,encrypted-dns-server=off

