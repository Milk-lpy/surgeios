[Script]
# 稳定性模式：不再在 engine-started / network-changed 时主动批量 retest。
# Surge 的 fallback / Smart 会在实际使用及网络变化后按需测试，避免启动阶段额外并发。
Surge状态面板 = type=generic,script-path=https://raw.githubusercontent.com/Milk-lpy/surgeios/main/Scripts/surge-status.js,script-update-interval=3600,timeout=20

[Panel]
智能网络状态 = title=Surge 智能网络,content=点击刷新：查看网络与交易出口,style=info,script-name=Surge状态面板,update-interval=180

# ============================================================
# 稳定性说明
# ============================================================
# 1) 关闭 auto-suspend，排除 Surge iOS 自动挂起路径。
# 2) DoH 仅保留 AliDNS，避免 doh.pub 在启动并发解析时返回 429。
# 3) Smart 自动池从 123 个缩减为约 30 个高频候选；全部节点仍可在“节点选择”里手动选择。
# 4) 交易 fallback 与美国稳定池均保持小候选范围，首次使用测试更轻。
# 5) 不在启动/网络切换事件中主动批量 retest，交易 fallback 仍会在实际使用时懒加载测试。

# ============================================================
# 可选 Module 建议
# ============================================================
# 主配置不直接启用 MITM / 大型广告规则，降低误杀与维护成本。
# 开屏去广告建议继续使用独立模块，需要时启用，不需要时关闭：
# https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/script/startup/startup.sgmodule
# 金融类 App（Binance / OKX / 银行 / 支付）不建议加入 MITM hostname。
